# ═══════════════════════════════════════════════════════════════════════════
# FLOATING BY DEFAULT
# ═══════════════════════════════════════════════════════════════════════════
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.SystemPreferences'
run = 'layout floating'

[[on-window-detected]]
